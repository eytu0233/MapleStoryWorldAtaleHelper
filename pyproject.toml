[project]
name = "maplestory-world-atale-zhtw"
version = "0.1.0"
description = "MapleStory World Atale ZhTW Channel Change Tool"
requires-python = ">=3.8"
dependencies = [
    "pyautogui",
    "opencv-python",
    "numpy",
    "pywin32",
    "pyscreeze",
    "pillow",
    "easyocr",
    "pynput",
    "scapy",
    "websockets",
    "PyQt5",
]

[project.optional-dependencies]
yolo = [
    "mss",
    "ultralytics",
    "torch",
    "torchvision",
    "torchaudio",
]

[tool.uv]
override-dependencies = [
    "pyqt5-qt5==5.15.2",
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu124" }]
torchvision = [{ index = "pytorch-cu124" }]
torchaudio = [{ index = "pytorch-cu124" }]
